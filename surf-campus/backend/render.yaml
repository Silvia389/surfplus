services:
  - type: web
    name: surf-campus
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SURF_SMS_PROVIDER
        value: mock
      - key: SURF_ENABLE_MOCK_AUTH
        value: "true"
      - key: SURF_DEV_AUTH_BYPASS
        value: "false"
      - key: SURF_AUTH_DEBUG_CODES
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
