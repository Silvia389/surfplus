services:
  - type: web
    name: surf-campus
    runtime: python
    plan: free
    rootDir: surf-campus/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PROVIDER
        value: deepseek
      - key: SURF_ENABLE_MOCK_AUTH
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      # ── Real SMS via Tencent Cloud (fill in Render dashboard to enable) ──
      # Left empty = mock mode (code 123456 still works for demos)
      - key: TENCENT_SMS_SECRET_ID
        sync: false
      - key: TENCENT_SMS_SECRET_KEY
        sync: false
      - key: TENCENT_SMS_SDK_APP_ID
        sync: false
      - key: TENCENT_SMS_SIGN_NAME
        sync: false
      - key: TENCENT_SMS_TEMPLATE_ID
        sync: false
