services:
  - type: web
    name: surf-campus
    runtime: python
    plan: free
    rootDir: surf-campus/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PROVIDER
        value: deepseek
      - key: SURF_ENABLE_MOCK_AUTH
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
